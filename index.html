<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polygon Area Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Polygon Area Calculator</h1>
      <p class="subtitle">OOP Rectangle &amp; Square Explorer powered by Pyodide</p>
    </header>

    <div class="grid">
      <!-- Shape Controls -->
      <div class="card">
        <h2>Configure Shapes</h2>

        <!-- Shape A (Primary) -->
        <div class="section-box">
          <h3>Primary Shape (Shape A)</h3>
          <div class="form-row">
            <label>Type:</label>
            <select id="shapeAType" onchange="toggleInputs('A')">
              <option value="rectangle">Rectangle</option>
              <option value="square">Square</option>
            </select>
          </div>
          <div class="form-row" id="rowAWidth">
            <label>Width:</label>
            <input type="number" id="shapeAWidth" value="10" min="1" max="100" />
          </div>
          <div class="form-row" id="rowAHeight">
            <label>Height:</label>
            <input type="number" id="shapeAHeight" value="5" min="1" max="100" />
          </div>
          <div class="form-row hidden" id="rowASide">
            <label>Side:</label>
            <input type="number" id="shapeASide" value="6" min="1" max="100" />
          </div>
        </div>
